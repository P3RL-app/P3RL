<style>
:root{--ink:#14152a;background:#14152a;--pn:#21242f;--cy:#12f7fd;--ye:#f6d508;--c:#66bdf9;--g:#568ff7;--a:#4a63ff;--sp:1;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:#fff;font:600 italic 16px 'Barlow','Arial Black',Arial,sans-serif;overflow-x:hidden;overscroll-behavior-y:none;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}

.dot,.sz,.rs,.cl,.gi,.tri,.tgc{transform-box:fill-box;transform-origin:50% 50%}

.glo.pu{animation:gl calc(1.8s*var(--sp)) ease-in-out infinite}

.cl{fill:none;stroke:var(--cy);stroke-width:3;vector-effect:non-scaling-stroke;opacity:0}  /* radius is animated frame by frame, never scaled */
.rs{fill:none;stroke:#6eaaff;stroke-width:4.5;opacity:0}

.rs.on{animation:rf calc(.45s*var(--sp)) ease-out both,rcy calc(5.6s*var(--sp)) ease-in-out infinite;animation-delay:calc(var(--k)*.13s*var(--sp)),calc((2s + var(--k)*.13s)*var(--sp))}

.devbtn{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;background:#ff4fd8;color:#000;border:0;padding:12px 16px;font-weight:900;font-size:15px;transform:skewX(-10deg);box-shadow:0 4px 0 #8a1b78}

.lg{font-size:13px;font-style:normal;max-height:130px;overflow:auto;line-height:1.5;opacity:.9}
.dvc textarea{font-size:12px;padding:8px;margin-top:8px}
.dvc small{opacity:.7;font-style:normal}

.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov .pnl{animation:pw .5s cubic-bezier(.2,.8,.2,1) backwards}
.ov .ttl{animation:fi .3s .05s backwards}

.ov .c .dot{animation-delay:.1s}.ov .g .dot{animation-delay:.22s}.ov .a .dot{animation-delay:.34s}

.ov .lbl{animation:fi .3s .5s backwards}.ov .stp{animation:fi .35s .65s backwards}
.bnw{opacity:0}.go .bnw{opacity:1;animation:bn .3s cubic-bezier(.2,1.2,.3,1) backwards}
.ok{opacity:0}.rdy .ok{opacity:1;animation:fi .3s backwards}

@keyframes pw{from{transform:translateX(1400px)}}
@keyframes gi{from{transform:rotate(-30deg) scale(.5);opacity:0}}
@keyframes pop{from{transform:scale(0)}}
@keyframes spin{from{transform:rotate(-240deg) scale(0)}}
@keyframes bn{from{transform:translateX(-1300px)}}
@keyframes lf{0%{opacity:.6}100%{opacity:0}}

@keyframes glg{0%{opacity:0;animation-timing-function:ease-out}12%{opacity:.95}35%{opacity:.95;animation-timing-function:ease-in-out}57%{opacity:0}100%{opacity:0}}
@keyframes rf{from{opacity:0}to{opacity:.08}}
@keyframes rcy{0%{opacity:.08}9%{opacity:.3}62%{opacity:.3}73%{opacity:.08}100%{opacity:.08}}
@keyframes sh{to{opacity:.8}}
