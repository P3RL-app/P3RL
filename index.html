<style>

.cl{fill:none;stroke:var(--cy);stroke-width:3;vector-effect:non-scaling-stroke;opacity:0}  /* radius is animated frame by frame, never scaled */

   they stay bright ~3 s, dim again inner-to-outer, rest, repeat. Fixed radii, they never move. */
.rs.on{animation:rf calc(.45s*var(--sp)) ease-out both,rcy calc(5.6s*var(--sp)) ease-in-out infinite;animation-delay:calc(var(--k)*.13s*var(--sp)),calc((2s + var(--k)*.13s)*var(--sp))}

.ch .c{color:var(--c)}.ch .g{color:#7fb0ff}.ch .a{color:#6f83ff}
.ch .x{font-style:normal;opacity:.7;padding:8px 10px;margin:-8px -6px -8px 0}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--cy);color:#000;border:0;padding:16px 26px;font-weight:900;font-size:19px;transform:skewX(-10deg);box-shadow:0 4px 0 #0a7f8a}
.fab{width:138px;text-align:center;padding-left:0!important;padding-right:0!important;right:22px!important}
.fab.fab2{right:auto!important;left:22px}
.devbtn{bottom:calc(86px + env(safe-area-inset-bottom,0px))!important;left:22px!important}

.sh.on{display:flex}
.card{width:100%;max-width:640px;max-height:92vh;overflow:auto;margin:0 auto;background:var(--pn);padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--cy);animation:su .25s both}
.card h3{margin:0 0 12px;font:900 italic 22px 'Barlow',sans-serif}

.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}

.stp2{display:flex;align-items:center;gap:14px;margin-top:12px}.stp2 span{font-size:28px;font-weight:900;min-width:32px;text-align:center}.stp2 button{width:56px;font-size:22px}
#sv2{background:var(--cy)!important;color:#000}
.pkc{max-width:420px}.pkc input{text-align:center;font-size:28px;letter-spacing:.5em}.pkm{min-height:1.2em;margin:10px 0 0;color:#ff7aa8;font-style:normal;font-size:14px}.pkc.bad{animation:pksh .35s}@keyframes pksh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#pko{background:var(--cy)!important;color:#000}
.mnc{max-height:86vh;display:flex;flex-direction:column;padding-top:12px}#mnb2{overflow:auto;flex:1;-webkit-overflow-scrolling:touch}

.pmn.on.op .psp{visibility:visible;animation:pspo .01s .9s both}@keyframes pspo{to{visibility:hidden}}
.psp .sb{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0)}
.pmn.on.op .psp .sb{animation:psb .5s var(--d) cubic-bezier(.15,.85,.3,1) both}

.pbase,.pcau{position:absolute;inset:0;width:100%;height:100%}

.pwal span{display:block;min-width:0}.pwal b{display:block;font:900 italic 18px/1.05 'Barlow Condensed','Barlow',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pwal small{display:block;font:700 11px 'Barlow',sans-serif;border-top:1px solid #000;margin-top:2px;padding-top:1px}
.pitems{position:absolute;left:50%;right:auto;width:max-content;top:calc(22% + env(safe-area-inset-top,0px));transform:translateX(-50%) rotate(-11deg);transform-origin:50% 50%;transition:transform .22s,opacity .22s,scale .28s ease-out}
.pi{position:relative;display:block;isolation:isolate;background:none!important;border:0;padding:0 .08em!important;min-height:0!important;margin:0 0 0 var(--x);font:900 italic clamp(30px,9.6vw,56px)/.86 'Barlow Condensed','Barlow',sans-serif;text-transform:uppercase;letter-spacing:-.005em;color:#5fe0ff;text-align:left;white-space:nowrap;cursor:pointer;transition:color .14s;-webkit-tap-highlight-color:transparent}

/* ===== Social Link ===== */
.arc{display:inline-block;flex:none;background-size:2300% 100%;background-repeat:no-repeat;image-rendering:auto;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.45);vertical-align:middle}

.sll{position:relative;transform:rotate(-2.5deg);transform-origin:0 0;padding-right:18px}

.slt{display:flex;align-items:center;gap:10px;background:#8df4ff;color:#05060c;padding:5px 14px 4px 8px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:background .12s}

.slr.on .slt{background:#fff;box-shadow:inset -7px 0 0 #e5001b}.slr.on .slno{background:#05060c;color:#fff;border-color:#05060c}.slr.on .slsub{background:#d9dde8;color:#05060c}
